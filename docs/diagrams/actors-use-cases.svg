<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#131b2e} .case{fill:#f7f9fc;stroke:#29528b;stroke-width:1.5}.link{stroke:#50617c;fill:none;stroke-width:1.4}</style>
<rect x="252" y="50" width="1127" height="790" fill="none" stroke="#29528b" stroke-width="2"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="816" y="32" text-anchor="middle" font-size="25" font-weight="bold">SmartCampus AI</text>
<g data-actor="Visiteur">
<circle cx="116" cy="114" r="16" fill="white" stroke="#29528b" stroke-width="2"/>
<path d="M116 130v44m-33-28h66m-33 28l-28 30m28-30l28 30" stroke="#29528b" stroke-width="2" fill="none"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="116" y="231" text-anchor="middle" font-size="20" font-weight="bold">Visiteur</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 146H240V65H438V78"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="438" cy="145" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="140" text-anchor="middle" font-size="19">Démarrer une conversation</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="164" text-anchor="middle" font-size="19">sans compte</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 146H240V65H803V78"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="803" cy="145" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="140" text-anchor="middle" font-size="19">Poser des questions sur les</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="164" text-anchor="middle" font-size="19">formations et parcours IIT / ISB</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 146H240V65H1168V78"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="1168" cy="145" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="140" text-anchor="middle" font-size="19">Découvrir le catalogue</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="164" text-anchor="middle" font-size="19">des formations</text>
</g>
<g data-actor="Candidat">
<circle cx="116" cy="304" r="16" fill="white" stroke="#29528b" stroke-width="2"/>
<path d="M116 320v44m-33-28h66m-33 28l-28 30m28-30l28 30" stroke="#29528b" stroke-width="2" fill="none"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="116" y="421" text-anchor="middle" font-size="20" font-weight="bold">Candidat</text>
