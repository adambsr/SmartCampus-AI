<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="1168" cy="335" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="330" text-anchor="middle" font-size="19">Préinscription, QCM, équivalence,</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="354" text-anchor="middle" font-size="19">rendez-vous, notifications et suivi</text>
</g>
<g data-actor="Responsable entretiens et rendez-vous">
<circle cx="116" cy="494" r="16" fill="white" stroke="#29528b" stroke-width="2"/>
<path d="M116 510v44m-33-28h66m-33 28l-28 30m28-30l28 30" stroke="#29528b" stroke-width="2" fill="none"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="116" y="611" text-anchor="middle" font-size="20" font-weight="bold">Responsable entretiens</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="116" y="634" text-anchor="middle" font-size="20" font-weight="bold">et rendez-vous</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 526H240V445H438V458"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="438" cy="525" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="520" text-anchor="middle" font-size="19">Consulter les candidats prêts,</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="544" text-anchor="middle" font-size="19">profils, résumés et résultats QCM</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 526H240V445H803V458"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="803" cy="525" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="520" text-anchor="middle" font-size="19">Préparer et réaliser les entretiens ;</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="544" text-anchor="middle" font-size="19">enregistrer résultats et observations</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 526H240V445H1168V458"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="1168" cy="525" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="520" text-anchor="middle" font-size="19">Définir ou valider les rendez-vous ;</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="544" text-anchor="middle" font-size="19">envoyer les invitations</text>
</g>
<g data-actor="Administrateur">
<circle cx="116" cy="684" r="16" fill="white" stroke="#29528b" stroke-width="2"/>
<path d="M116 700v44m-33-28h66m-33 28l-28 30m28-30l28 30" stroke="#29528b" stroke-width="2" fill="none"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="116" y="801" text-anchor="middle" font-size="20" font-weight="bold">Administrateur</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 716H240V635H438V648"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="438" cy="715" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="710" text-anchor="middle" font-size="19">Gérer comptes, rôles et formations ;</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="734" text-anchor="middle" font-size="19">administrer les sources RAG</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 716H240V635H803V648"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="803" cy="715" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="698" text-anchor="middle" font-size="19">Configurer orientation, QCM et</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="722" text-anchor="middle" font-size="19">notifications ; vérifier, confirmer</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="803" y="746" text-anchor="middle" font-size="19">ou ajuster les recommandations</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 716H240V635H1168V648"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="1168" cy="715" rx="170" ry="67"/>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="698" text-anchor="middle" font-size="19">Consulter dossiers, profils, QCM ;</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="722" text-anchor="middle" font-size="19">superviser agents et journaux ;</text>
<text font-family="Arial,sans-serif" fill="#131b2e" x="1168" y="746" text-anchor="middle" font-size="19">consulter tableau de bord/statistiques</text>
</g>
<text font-family="Arial,sans-serif" fill="#131b2e" x="700" y="872" text-anchor="middle" font-size="18">Périmètre métier cible — les fonctionnalités futures ne sont pas toutes implémentées.</text>
</svg>