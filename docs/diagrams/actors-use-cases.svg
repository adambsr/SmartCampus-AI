<text font-family="Arial,sans-serif" fill="#131b2e" x="438" y="354" text-anchor="middle" font-size="19">ses conversations</text>
<path fill="none" stroke="#50617c" stroke-width="1.4" d="M150 336H240V255H803V268"/>
<ellipse fill="#f7f9fc" stroke="#29528b" stroke-width="1.5" cx="803" cy="335" rx="170" ry="67"/>
