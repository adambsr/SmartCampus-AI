# Alembic config for the SmartCampus AI database (Track A, SA-17).
# Run from the repo root:
#   alembic -c database/alembic.ini upgrade head            -> real database (DATABASE_URL)
#   alembic -c database/alembic.ini -x db=test upgrade head -> test database (TEST_DATABASE_URL)
# The connection string is read from .env, never written here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
